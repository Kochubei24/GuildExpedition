name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Decode and extract project
        run: |
          cat << 'B64EOF' | base64 -d > project.zip

          unzip -q project.zip
          mv GuildExpedition/* .
          mv GuildExpedition/.* . 2>/dev/null || true
          rmdir GuildExpedition

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: GuildExpedition-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
